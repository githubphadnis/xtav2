{% macro currency_select(name, selected, currencies, required=true) -%}
<select name="{{ name }}" {% if required %}required{% endif %}
        style="width:100%;padding:0.75rem 0.85rem;font:inherit;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)">
  {% for code in currencies %}
  <option value="{{ code }}" {% if code == selected %}selected{% endif %}>{{ code }}</option>
  {% endfor %}
  {% if selected and selected not in currencies %}
  <option value="{{ selected }}" selected>{{ selected }}</option>
  {% endif %}
</select>
{%- endmacro %}
